# @ka-studio/dsh-work 的 bundle 层。
#
# DSH 的 profile 是「一叠 bundle 补丁」，本文件就是本插件插进那叠补丁的那一行。
# 装配方式：profile 的 dsh.profile.bundles 里加入本包 → 宿主按 dsh.bundle.patch 读取本文件。
#
# id 用 `dsh-work`：它同时是「同一份配置里唯一」的约束，将来做多实例（不同工作区各一条）
# 时改为 `dsh-work@<别名>`，不用改包名。
- insert:
    - id: dsh-work
      name: '@ka-studio/dsh-work'
      config: {}
