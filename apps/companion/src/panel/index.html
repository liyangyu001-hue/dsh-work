<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>DSH Work · 面板</title>
    <style>
      /*
       * 面板 = 这个产品真正的承载体。
       *
       * 小条只回答"现在到哪了"；面板回答"这一步具体干什么、下一步是什么、我能做什么"。
       * 所以版面按"当前节点居中的卡片带 + 右侧详情"来分：
       *   左 62% 横向卡片带（已完成 ← 当前 → 待进行）
       *   右 38% 详情（目标 / 验收 / AI 建议）
       * 这个比例不是随手定的：卡片带要能同时露出左右邻卡，才算"看得出进度"。
       *
       * 视觉遵循 docs/DESIGN-SYSTEM.md：玻璃、发丝边、双层投影；
       * 动效只保留"缓入缓出"，进入用 160ms 上浮 6px，不做弹跳。
       */
      :root {
        --dswork-ink: rgba(245, 245, 247, 0.96);
        --dswork-ink-dim: rgba(235, 235, 245, 0.58);
        --dswork-ink-faint: rgba(235, 235, 245, 0.32);
        --dswork-accent: #0a84ff;
        --dswork-ok: #30d158;
        --dswork-warn: #ff9f0a;
        --dswork-glass: rgba(28, 28, 30, 0.82);
        --dswork-tint: rgba(24, 24, 27, 0.58);
        --dswork-hairline: rgba(255, 255, 255, 0.1);
        --dswork-card: rgba(255, 255, 255, 0.055);
        --dswork-card-edge: rgba(255, 255, 255, 0.08);
        --dswork-dur-fast: 120ms;
        --dswork-dur-base: 200ms;
        --dswork-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --dswork-radius: 24px;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --dswork-ink: rgba(0, 0, 0, 0.9);
          --dswork-ink-dim: rgba(0, 0, 0, 0.52);
          --dswork-ink-faint: rgba(0, 0, 0, 0.28);
          --dswork-glass: rgba(250, 250, 252, 0.84);
        --dswork-tint: rgba(250, 250, 252, 0.62);
          --dswork-hairline: rgba(0, 0, 0, 0.08);
          --dswork-card: rgba(0, 0, 0, 0.04);
          --dswork-card-edge: rgba(0, 0, 0, 0.06);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font: 400 13px/1.45 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: var(--dswork-ink);
        -webkit-user-select: none;
        user-select: none;
      }

      #panel {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        border-radius: var(--dswork-radius);
        background: var(--dswork-tint);
        box-shadow:
          0 0 0 0.5px var(--dswork-hairline) inset,
          0 1px 0 0 rgba(255, 255, 255, 0.06) inset,
          0 18px 50px rgba(0, 0, 0, 0.42),
          0 2px 8px rgba(0, 0, 0, 0.24);
        overflow: hidden;
      }

      /*
       * 玻璃的"底"：主进程抓来的桌面截图，在这里被 CSS 模糊掉。
       *
       * 为什么不直接用 backdrop-filter：透明窗口背后是桌面而不是页面内容，
       * backdrop-filter 拿不到，做了也是白做（详见 src/backdrop.cjs 的注释）。
       * 这里用一张静态底图 + filter: blur()，观感与真毛玻璃一致，且能保留圆角。
       */
      #backdrop {
        position: absolute;
        inset: -48px;
        z-index: 0;
        background-position: center;
        background-size: cover;
        filter: blur(26px) saturate(165%) brightness(0.88);
        opacity: 0;
        transition: opacity var(--dswork-dur-slow) var(--dswork-ease-out);
      }

      #backdrop.on {
        opacity: 1;
      }

      /* 所有内容都压在底图之上 */
      #panel > :not(#backdrop) {
        position: relative;
        z-index: 1;
      }

      /* ── 头部 ───────────────────────────────────────────── */
      header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 52px;
        padding: 0 16px 0 18px;
        border-bottom: 0.5px solid var(--dswork-hairline);
      }

      .dot {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--dswork-accent);
        box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.16);
      }

      .dot.done {
        background: var(--dswork-ok);
        box-shadow: 0 0 0 3px rgba(48, 209, 88, 0.16);
      }

      .dot.offline {
        background: var(--dswork-ink-faint);
        box-shadow: none;
      }

      .head-title {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .progress {
        flex: 0 0 auto;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: var(--dswork-ink-dim);
      }

      .icon-btn {
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--dswork-ink-dim);
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
      }

      .icon-btn:hover {
        background: var(--dswork-card);
        color: var(--dswork-ink);
      }

      /* ── 主体 ───────────────────────────────────────────── */
      .body {
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
      }

      /* 卡片带：左右都能露出一截邻卡，才看得出"前/后还有东西" */
      .rail {
        flex: 1 1 62%;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 10px 18px 18px;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }

      .rail::-webkit-scrollbar {
        display: none;
      }

      .card {
        flex: 0 0 132px;
        scroll-snap-align: center;
        padding: 10px 12px;
        border-radius: 14px;
        background: var(--dswork-card);
        box-shadow: 0 0 0 0.5px var(--dswork-card-edge) inset;
        color: var(--dswork-ink-dim);
        transition:
          transform var(--dswork-dur-base) var(--dswork-ease-out),
          background var(--dswork-dur-fast) linear,
          box-shadow var(--dswork-dur-fast) linear;
      }

      .card .tag {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dswork-ink-faint);
        margin-bottom: 6px;
      }

      .card .name {
        font-size: 13px;
        line-height: 1.4;
        color: inherit;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .card.current {
        flex-basis: 176px;
        background: rgba(10, 132, 255, 0.12);
        box-shadow:
          0 0 0 0.5px rgba(10, 132, 255, 0.45) inset,
          0 8px 24px rgba(10, 132, 255, 0.14);
        color: var(--dswork-ink);
        transform: translateY(-2px);
      }

      .card.current .tag {
        color: rgba(120, 180, 255, 0.9);
      }

      .card.done .name {
        text-decoration: line-through;
        text-decoration-color: var(--dswork-ink-faint);
        color: var(--dswork-ink-faint);
      }

      .card.focused {
        outline: none;
        box-shadow:
          0 0 0 2px var(--dswork-accent) inset,
          0 0 0 0.5px transparent;
      }

      /* 右侧详情 */
      .detail {
        flex: 0 0 38%;
        min-width: 0;
        padding: 18px 18px 18px 4px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
        border-left: 0.5px solid var(--dswork-hairline);
      }

      .detail::-webkit-scrollbar {
        width: 0;
      }

      .section-name {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dswork-ink-faint);
        margin-bottom: 5px;
      }

      .detail p {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.55;
        color: var(--dswork-ink-dim);
        white-space: pre-wrap;
      }

      .detail .primary {
        color: var(--dswork-ink);
      }

      .advice {
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(10, 132, 255, 0.08);
        box-shadow: 0 0 0 0.5px rgba(10, 132, 255, 0.24) inset;
      }

      .advice p {
        color: var(--dswork-ink);
      }

      .advice .alt {
        margin-top: 6px;
        font-size: 12px;
        color: var(--dswork-ink-dim);
      }

      /* ── 空状态 ─────────────────────────────────────────── */
      .empty {
        flex: 1 1 auto;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 40px;
        text-align: center;
      }

      body.is-empty .empty {
        display: flex;
      }

      body.is-empty .body {
        display: none;
      }

      .empty h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .empty p {
        margin: 0;
        font-size: 12.5px;
        color: var(--dswork-ink-dim);
        max-width: 380px;
      }

      kbd {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 5px;
        background: var(--dswork-card);
        box-shadow: 0 0 0 0.5px var(--dswork-card-edge) inset;
        font: inherit;
        font-size: 11px;
        color: var(--dswork-ink);
      }

      /* ── 底部 ───────────────────────────────────────────── */
      footer {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 14px;
        height: 38px;
        padding: 0 18px;
        border-top: 0.5px solid var(--dswork-hairline);
        font-size: 11.5px;
        color: var(--dswork-ink-faint);
      }

      footer .hint {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      footer .spacer {
        flex: 1 1 auto;
      }

      footer .conn {
        color: var(--dswork-ink-faint);
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }
      }
    </style>
  </head>
  <body class="is-empty">
    <div id="panel">
      <div id="backdrop"></div>
      <header>
        <span class="dot offline" id="dot"></span>
        <span class="head-title" id="head-title">DSH Work</span>
        <span class="progress" id="progress"></span>
        <button class="icon-btn" id="close" title="关闭（Esc）">✕</button>
      </header>

      <div class="body">
        <div class="rail" id="rail"></div>
        <div class="detail" id="detail"></div>
      </div>

      <div class="empty">
        <h2>还没有任务</h2>
        <p>
          按 <kbd>Tab</kbd> 框选屏幕上正在看的东西，我来拆成任务；<br />
          或者直接把你想做的事说出来。
        </p>
      </div>

      <footer>
        <span class="hint"><kbd>Tab</kbd> 框选</span>
        <span class="hint"><kbd>Enter</kbd> 完成</span>
        <span class="hint"><kbd>Backspace</kbd> 上一个</span>
        <span class="spacer"></span>
        <span class="conn" id="conn"></span>
      </footer>
    </div>

    <script>
      const railEl = document.getElementById("rail");
      const detailEl = document.getElementById("detail");
      const headTitleEl = document.getElementById("head-title");
      const progressEl = document.getElementById("progress");
      const dotEl = document.getElementById("dot");
      const connEl = document.getElementById("conn");

      /** 当前快照里"正在做"的那个节点 id */
      let pointer = null;
      /** 键盘焦点所在的卡片 id（←→ 移动，不改变任务状态） */
      let focused = null;
      /** 最近一次框选结果，留给"解构任务"用 */
      let lastCapture = null;
      /** 最近一次识别进度：{ phase: "start" | "done" | "error", count?, title?, message? } */
      let recognize = null;

      const LABELS = { active: "进行中", done: "已完成", todo: "待进行", skipped: "已跳过" };

      function nodesOf(doc) {
        return doc ? Object.values(doc.nodes) : [];
      }

      /**
       * 把树压成一条深度优先的顺序。
       *
       * 为什么不直接用 doc 的顺序：对象键的顺序不是产品语义，卡片带的顺序必须是
       * "完成后会走到哪"，也就是核心状态机里 linearOrder 的同一套规则。
       */
      function linearOrder(doc) {
        if (!doc) return [];
        const out = [];
        const walk = (id) => {
          const node = doc.nodes[id];
          if (!node) return;
          out.push(node);
          for (const child of node.children) walk(child);
        };
        for (const root of doc.roots) walk(root);
        return out;
      }

      function render(payload) {
        const { state, snapshot } = payload || {};
        const doc = snapshot?.doc ?? null;

        connEl.textContent =
          state === "online" ? "已连接" : state === "connecting" ? "连接中…" : "DSH 未运行";

        const linked = state === "online";
        dotEl.classList.toggle("offline", !linked);

        if (!doc) {
          document.body.classList.add("is-empty");
          headTitleEl.textContent = "DSH Work";
          progressEl.textContent = "";
          dotEl.classList.toggle("offline", true);
          return;
        }

        const order = linearOrder(doc);
        const total = order.filter((n) => n.kind === "task").length;
        const done = order.filter((n) => n.kind === "task" && n.status === "done").length;

        document.body.classList.toggle("is-empty", total === 0);
        headTitleEl.textContent = doc.title || "未命名任务";
        progressEl.textContent = total ? `${done}/${total}` : "";

        pointer = doc.pointer;
        const current = pointer ? doc.nodes[pointer] : null;
        dotEl.classList.toggle("done", !current && total > 0);

        if (!focused || !doc.nodes[focused]) focused = pointer ?? order[0]?.id ?? null;

        railEl.innerHTML = "";
        for (const node of order) {
          railEl.appendChild(cardEl(node, doc));
        }
        // 让当前节点居中：卡片带的存在意义就是"我在中间，两边是过去和将来"
        requestAnimationFrame(() => {
          const target = railEl.querySelector(".card.current") || railEl.querySelector(".card.focused");
          target?.scrollIntoView({ block: "nearest", inline: "center", behavior: "instant" });
        });

        renderDetail(current);
      }

      function cardEl(node, doc) {
        const el = document.createElement("div");
        el.className = "card";
        if (node.id === doc.pointer) el.classList.add("current");
        if (node.status === "done") el.classList.add("done");
        if (node.id === focused) el.classList.add("focused");
        el.dataset.id = node.id;

        const tag = document.createElement("div");
        tag.className = "tag";
        tag.textContent = `${LABELS[node.status] || node.status}${node.kind === "concept" ? " · 概念" : ""}`;

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = node.title;

        el.append(tag, name);
        el.addEventListener("click", () => {
          focused = node.id;
          render(lastPayload);
        });
        return el;
      }

      function renderDetail(node) {
        detailEl.innerHTML = "";
        if (!node) {
          detailEl.innerHTML = `<p class="primary">全部完成。按 <kbd>Backspace</kbd> 回到上一个。</p>`;
          return;
        }

        const block = (label, text, cls = "") => {
          if (!text) return;
          const wrap = document.createElement("div");
          if (cls) wrap.className = cls;
          const nameEl = document.createElement("div");
          nameEl.className = "section-name";
          nameEl.textContent = label;
          const p = document.createElement("p");
          p.textContent = text;
          wrap.append(nameEl, p);
          detailEl.appendChild(wrap);
        };

        block("目标", node.detail || node.title, "primary");
        block("验收", node.acceptance);

        if (node.advice?.text) {
          const wrap = document.createElement("div");
          wrap.className = "advice";
          wrap.innerHTML =
            `<div class="section-name">建议</div><p id="advice-text"></p>` +
            (node.advice.alt ? `<p class="alt" id="advice-alt"></p>` : "");
          detailEl.appendChild(wrap);
          wrap.querySelector("#advice-text").textContent = node.advice.text;
          if (node.advice.alt) wrap.querySelector("#advice-alt").textContent = `或者：${node.advice.alt}`;
        }

        if (lastCapture) {
          const block = recognizeBlock();
          if (block) detailEl.appendChild(block);
        }
      }

      /**
       * 「刚才那张截图现在怎么样了」。
       *
       * 三种状态必须分开写清楚：识别中给不出结果时，用户要知道是还在等还是坏了；
       * 失败要给出原因，因为「没反应」是这类后台动作最糟的反馈。
       */
      function recognizeBlock() {
        if (!recognize) return null;

        const wrap = document.createElement("div");
        wrap.className = "advice";
        const nameEl = document.createElement("div");
        nameEl.className = "section-name";
        const p = document.createElement("p");

        if (recognize.phase === "start") {
          nameEl.textContent = "识别中";
          // 面板可能比截图晚起来（热键刚按就重载），没有尺寸就不硬编一个
          const size = lastCapture ? `（${lastCapture.width} × ${lastCapture.height} px）` : "";
          p.textContent = `正在读这张截图${size}…`;
        } else if (recognize.phase === "done") {
          nameEl.textContent = "已拆解";
          p.textContent = `生成了 ${recognize.count} 个任务${recognize.title ? `，整体是「${recognize.title}」` : ""}`;
        } else {
          nameEl.textContent = "识别失败";
          p.textContent = `${recognize.message || "未知原因"}（计划没有改动）`;
        }

        wrap.append(nameEl, p);
        return wrap;
      }

      /* ── 键盘 ───────────────────────────────────────────── */
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          window.dshworkPanel.close();
          return;
        }
        if (event.key === "Tab") {
          event.preventDefault();
          window.dshworkPanel.capture();
          return;
        }
        if (event.key === "Enter") {
          event.preventDefault();
          window.dshworkPanel.intent({ type: "node.advance" });
          return;
        }
        if (event.key === "Backspace") {
          event.preventDefault();
          window.dshworkPanel.intent({ type: "node.back" });
          return;
        }
        if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
          event.preventDefault();
          const cards = [...railEl.querySelectorAll(".card")];
          const at = cards.findIndex((c) => c.dataset.id === focused);
          const next = cards[at + (event.key === "ArrowRight" ? 1 : -1)];
          if (next) {
            focused = next.dataset.id;
            render(lastPayload);
          }
        }
      });

      document.getElementById("close").addEventListener("click", () => window.dshworkPanel.close());

      /* ── 与主进程 ───────────────────────────────────────── */
      let lastPayload = null;
      window.dshworkPanel.onState((payload) => {
        lastPayload = payload;
        render(payload);
      });

      window.dshworkPanel.onCapture((result) => {
        lastCapture = result;
        // 新一张图进来，上一张的识别结论就过期了
        recognize = null;
        if (lastPayload) render(lastPayload);
      });

      // 识别结果由主进程推来；计划本身不在这里接收 —— 落地后走 SSE 更新整棵树
      window.dshworkPanel.onRecognize((message) => {
        if (!message) return;
        recognize = message;
        if (lastPayload) render(lastPayload);
      });

      // 玻璃的底：主进程每次展开都会重新采一张背后的桌面
      const backdropEl = document.getElementById("backdrop");
      window.dshworkPanel.onBackdrop((url) => {
        if (!url) return;
        backdropEl.style.backgroundImage = `url("${url}")`;
        backdropEl.classList.add("on");
      });

      window.dshworkPanel.ready();
    </script>
  </body>
</html>
