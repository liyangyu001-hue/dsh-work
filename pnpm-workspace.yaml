packages:
  - packages/*
  - apps/*

# esbuild 的安装脚本只做「把平台二进制就位」，是构建必需项。
# electron 的安装脚本负责下载对应平台的运行时二进制 —— 没有它 Electron 启动不了。
allowBuilds:
  electron: true
  esbuild: true

# 宿主提供的模块（@deepseek-ai/dsh-tools 等）以 peerDependency 声明 ——
# 宿主的模块解析层据此把它们映射到自己的实例。这些包不在公共 npm 上，
# 自动装 peer 会去 registry 拉一条 404 链路把 install 打断，所以一律关掉。
# （pnpm 11 起 pnpm 专属设置放在这里，不放 .npmrc —— 放 .npmrc 不生效。）
autoInstallPeers: false
strictPeerDependencies: false

# 运行脚本前不隐式跑 install：CI 与本地都应显式 `pnpm install`，
# 否则 `pnpm test` 会在后台起一条不受控的安装。
verifyDepsBeforeRun: false
